<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single Sign-On — the film</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #efe6d4; padding: 16px; box-sizing: border-box; }
  #film { width: min(1200px, 100%); }
</style>
</head>
<body>
<div id="film"></div>
<script type="module">
  import { createFilm } from "./film.js";
  const q = new URLSearchParams(location.search);
  window.__film = await createFilm(document.getElementById("film"), {
    startAt: q.has("t") ? parseFloat(q.get("t")) : 0,
    cta: [
      { label: "Try it: sign in to Aircall →", href: "/vendors/aircall", primary: true },
      { label: "Watch SCIM in action →", href: "/provisioning" },
    ],
  });
</script>
</body>
</html>
